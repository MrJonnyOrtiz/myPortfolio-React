AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Serverless Contact Us form for jonnyortiz.com
Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
    - Label:
        default: Configuration
      Parameters:
      - Subject
      - ToEmailAddress
      - ReCaptchaSecret
Parameters:
  Subject:
    Type: String
    Description: Contact us email subject
  ToEmailAddress:
    Type: String
    Description: Email address you want contact form submissions to go to
  ReCaptchaSecret:
    Type: String
    Description: Your Google reCAPTCHA secret
Resources:
  ContactUsSNSTopic:
    Type: AWS::SNS::Topic
    Properties:
      DisplayName:
        Fn::Join:
        - ''
        - - Ref: AWS::StackName
          - ' Topic'
      Subscription:
      - Endpoint:
          Ref: ToEmailAddress
        Protocol: email
      TopicName:
        Fn::Join:
        - ''
        - - Ref: AWS::StackName
          - -topic
  ContactUsApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: Prod
      Cors:
        AllowMethods: '''POST,OPTIONS'''
        AllowHeaders: '''Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'''
        AllowOrigin: '''*'''
  ContactUsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: index.handler
      Timeout: 5
      CodeUri: ContactUsFunction
      Runtime: nodejs20.x
      Policies:
      - SNSPublishMessagePolicy:
          TopicName:
            Fn::GetAtt:
            - ContactUsSNSTopic
            - TopicName
      Events:
        PostEvent:
          Type: Api
          Properties:
            Path: /
            Method: post
            RestApiId:
              Ref: ContactUsApi
        OptionsEvent:
          Type: Api
          Properties:
            Path: /
            Method: options
            RestApiId:
              Ref: ContactUsApi
      Environment:
        Variables:
          ReCaptchaSecret:
            Ref: ReCaptchaSecret
          ContactUsSNSTopic:
            Ref: ContactUsSNSTopic
          Subject:
            Ref: Subject
    Metadata:
      SamResourceId: ContactUsFunction
Outputs:
  ApiUrl:
    Description: URL of your API endpoint
    Value:
      Fn::Join:
      - ''
      - - https://
        - Ref: ContactUsApi
        - .execute-api.
        - Ref: AWS::Region
        - .amazonaws.com/Prod
